name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fail on any known vulnerability
        run: npm audit --audit-level=low
      - run: npm run build:packages
      - name: Action bundle is committed and up to date
        run: git diff --exit-code -- packages/action/dist
      - run: npm run typecheck
      - run: npm test
      - name: Build the editor
        run: npm run build -w @readmeops/editor
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  live-smoke:
    # Runs this repository's action against the maintainer's real public profile with the
    # default GITHUB_TOKEN, without pushing. Proves the GraphQL queries against the live API.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render every card (dry run)
        uses: ./
        with:
          look: terminal
          cards: profile, stats, activity, upstream, languages, repos, writing
          dry-run: "true"
